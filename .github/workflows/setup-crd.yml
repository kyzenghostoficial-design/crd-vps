name: Setup CRD
on:
  workflow_dispatch:
    inputs:
      crd_code:
        description: 'Google Auth Code'
        required: true
      crd_pin:
        description: 'PIN (6+ digits)'
        required: true

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install XFCE4 + Chrome + CRD
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xfce4 xfce4-terminal dbus-x11 wget
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O /tmp/chrome.deb
          sudo apt-get install -y /tmp/chrome.deb || sudo apt-get -f install -y
          wget -q https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb -O /tmp/crd.deb
          sudo apt-get install -y /tmp/crd.deb || sudo apt-get -f install -y
          echo "exec /usr/bin/xfce4-session" | sudo tee /etc/chrome-remote-desktop-session

      - name: Configure Chrome Remote Desktop
        run: |
          DISPLAY= /opt/google/chrome-remote-desktop/start-host \
            --code="${{ github.event.inputs.crd_code }}" \
            --redirect-url="https://remotedesktop.google.com/_/oauthredirect" \
            --name="github-vps"

      - name: Keep alive (6 hours)
        run: |
          echo "VPS online! Conecte pelo Chrome Remote Desktop no celular."
          echo "Esta VPS fica ativa por 6 horas."
          sleep 21600
