name: CRD Setup
on:
  workflow_dispatch:
    inputs:
      crd_code:
        description: 'Google Auth Code'
        required: true
      crd_pin:
        description: 'PIN'
        required: true

jobs:
  crd:
    runs-on: ubuntu-22.04
    steps:
      - name: Setup CRD
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y xfce4 xfce4-terminal dbus-x11 wget
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O /tmp/c.deb
          sudo apt-get install -y /tmp/c.deb || sudo apt-get -f install -y
          wget -q https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb -O /tmp/crd.deb
          sudo apt-get install -y /tmp/crd.deb || sudo apt-get -f install -y
          echo "exec /usr/bin/xfce4-session" | sudo tee /etc/chrome-remote-desktop-session
          DISPLAY= /opt/google/chrome-remote-desktop/start-host \
            --code="${{ github.event.inputs.crd_code }}" \
            --redirect-url="https://remotedesktop.google.com/_/oauthredirect" \
            --name="minha-vps"
          echo "=== PRONTO ==="
          sleep 21600
